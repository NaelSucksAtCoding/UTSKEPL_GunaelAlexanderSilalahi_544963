server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Request API dari browser diteruskan ke service "backend" lewat jaringan
    # Docker Compose. Nama service di-resolve oleh DNS internal Docker saat ada
    # request, sehingga Nginx tetap bisa start walaupun backend belum tersedia.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:80;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router memakai history mode: semua path diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
