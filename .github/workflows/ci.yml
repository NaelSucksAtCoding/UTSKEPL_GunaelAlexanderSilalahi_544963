name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Laravel API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependency Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan file .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan feature test
        run: php artisan test

  frontend:
    name: Frontend (Vue.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency npm
        run: npm ci

      - name: Build aplikasi
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
